<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Impostor - Início</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1>🎭 IMPOSTOR</h1>
        <p class="subtitle">Descubra quem é o impostor!</p>
    </header>

    <div th:if="${error}" class="alert alert-error">
        <p th:text="${error}"></p>
    </div>

    <div class="main-content">
        <div class="card">
            <h2>🎮 Criar Nova Sala</h2>
            <form th:action="@{/room/create}" method="post">
                <div class="form-group">
                    <label for="createRoomName">Nome da Sala:</label>
                    <input type="text" id="createRoomName" name="roomName" placeholder="Ex: Sala dos Amigos" required maxlength="50">
                </div>
                <div class="form-group">
                    <label for="createPlayerName">Seu Nome:</label>
                    <input type="text" id="createPlayerName" name="playerName" placeholder="Digite seu nome" required maxlength="20">
                </div>
                <button type="submit" class="btn btn-primary">Criar Sala</button>
            </form>
        </div>

        <div style="text-align: center; margin: 10px 0; color: var(--color-text-muted); font-weight: bold;">OU</div>

        <div class="card">
            <h2>🚪 Entrar em uma Sala</h2>
            <form th:action="@{/room/join}" method="post">
                <div class="form-group">
                    <label for="joinRoomCode">Código da Sala:</label>
                    <input type="text" id="joinRoomCode" name="roomCode" placeholder="CÓDIGO" required maxlength="4" style="text-transform: uppercase; text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
                </div>
                <div class="form-group">
                    <label for="joinPlayerName">Seu Nome:</label>
                    <input type="text" id="joinPlayerName" name="playerName" placeholder="Digite seu nome" required maxlength="20">
                </div>
                <button type="submit" class="btn btn-secondary">Entrar na Sala</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('joinRoomCode').addEventListener('input', function(e) {
        e.target.value = e.target.value.toUpperCase();
    });
</script>
</body>
</html>
